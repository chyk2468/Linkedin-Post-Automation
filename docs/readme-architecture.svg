<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">LinkedIn Post Automation workflow</title><desc id="desc">The Streamlit app coordinates topic research, draft writing, image selection, posting, and a local publication history.</desc><rect width="1200" height="400" rx="18" fill="#101822"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#2970FF">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#F2F6FA">LinkedIn Post Automation</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A7B5C4">A topic brief to a prepared social post</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#2D3D4D"/><path d="M 300 237 L 330 237" stroke="#A7B5C4" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#A7B5C4" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#A7B5C4" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#A7B5C4" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#A7B5C4" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#A7B5C4" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#192634" stroke="#2D3D4D" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#2970FF"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2970FF">01 / TOPIC</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F2F6FA">Topic or schedule</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B5C4">Select a content theme.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#192634" stroke="#2D3D4D" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#00B879"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#00B879">02 / RESEARCH</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F2F6FA">Serper search</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B5C4">Gather relevant source context.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#192634" stroke="#2D3D4D" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#D1A85C"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#D1A85C">03 / DRAFT + IMAGE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F2F6FA">Groq and Pexels</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B5C4">Write copy and find an image.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#192634" stroke="#2D3D4D" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#2970FF"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2970FF">04 / PUBLISH</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F2F6FA">LinkedIn + history</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B5C4">Post and record the outcome.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#2970FF">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7B5C4">Review generated copy, image rights, and target account before publishing.</text></svg>